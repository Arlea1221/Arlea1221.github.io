<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>组词查询</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f9f9f9;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>组词查询</h1>
    <form id="queryForm">
        <label for="word">请输入汉字或词语：</label>
        <input type="text" id="word" name="word" maxlength="10" required>
        <button type="submit">查询</button>
    </form>
    <div id="result" class="result"></div>

    <script>
        document.getElementById('queryForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const word = document.getElementById('word').value.trim();
            const resultDiv = document.getElementById('result');

            if (!word) {
                resultDiv.innerHTML = '<p class="error">请输入有效的汉字或词语。</p>';
                return;
            }

            try {
                // 调用服务器接口
                const response = await fetch(`https://ueajewmifbey.ap-northeast-1.clawcloudrun.com/query?word=${encodeURIComponent(word)}`);
                if (!response.ok) {
                    throw new Error(`HTTP错误！状态码: ${response.status}`);
                }

                const html = await response.text(); // 获取服务器返回的HTML内容
                resultDiv.innerHTML = html; // 将结果显示在页面上
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">查询失败：${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
