<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>组词查询与图像查询</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f9f9f9;
        }
        .error {
            color: red;
        }
        #imageContainer img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>组词查询与图像查询</h1>

    <!-- 组词查询表单 -->
    <form id="wordQueryForm">
        <label for="wordInput">请输入汉字或词语：</label>
        <input type="text" id="wordInput" name="word" maxlength="10" required placeholder="请输入汉字">
        <button type="submit">组词查询</button>
    </form>
    <div id="wordResult" class="result"></div>

    <!-- 图像查询表单 -->
    <form id="imageQueryForm">
        <label for="imageInput">Enter an image keyword (English):</label>
        <input type="text" id="imageInput" name="image" maxlength="20" required placeholder="Enter English keyword">
        <button type="submit">Search Image</button>
    </form>
    <div id="imageContainer" class="result"></div>

    <script>
        // 检查是否为汉字的正则表达式
        const isChinese = (text) => /^[\u4e00-\u9fa5]+$/.test(text);

        // 组词查询逻辑
        document.getElementById('wordQueryForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const word = document.getElementById('wordInput').value.trim();
            const wordResultDiv = document.getElementById('wordResult');

            if (!word || !isChinese(word)) {
                wordResultDiv.innerHTML = '<p class="error">请输入有效的汉字。</p>';
                return;
            }

            // 清空之前的结果
            wordResultDiv.innerHTML = '';

            try {
                const response = await fetch(`https://ueajewmifbey.ap-northeast-1.clawcloudrun.com/query?word=${encodeURIComponent(word)}`);
                if (!response.ok) {
                    throw new Error(`HTTP错误！状态码: ${response.status}`);
                }

                const html = await response.text();
                wordResultDiv.innerHTML = html;
            } catch (error) {
                wordResultDiv.innerHTML = `<p class="error">查询失败：${error.message}</p>`;
            }
        });

        // 图像查询逻辑
        document.getElementById('imageQueryForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const imageKeyword = document.getElementById('imageInput').value.trim();
            const imageContainer = document.getElementById('imageContainer');

            if (!imageKeyword || /[^a-zA-Z\s]/.test(imageKeyword)) {
                imageContainer.innerHTML = '<p class="error">Please enter a valid English keyword.</p>';
                return;
            }

            // 清空之前的结果
            imageContainer.innerHTML = '';

            try {
                const imageResponse = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(imageKeyword)}&client_id=3hqWCwNup4i5ndAzfNXABPwDX9yU8eBMY3mvSD9XsQw`);
                if (!imageResponse.ok) {
                    throw new Error('Image search failed');
                }

                const imageData = await imageResponse.json();
                if (imageData.results.length > 0) {
                    const photo = imageData.results[0];
                    const imgElement = document.createElement('img');
                    imgElement.src = photo.urls.regular;
                    imageContainer.appendChild(imgElement);
                } else {
                    imageContainer.innerHTML = '<p class="error">No related images found.</p>';
                }
            } catch (error) {
                imageContainer.innerHTML = `<p class="error">Image search failed: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
